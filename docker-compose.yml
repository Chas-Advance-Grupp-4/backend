services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logistics_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d logistics_db"]
      interval: 5s
      retries: 5
      timeout: 5s

  server:
    image: chasadvancegroup4/chas_advance_backend:latest
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  db_data:
